<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Walify: vision and public evidence</title><desc id="desc">Author-stated vision: people and agents use software together with Tavi as personal assistant. Public evidence is a local execution demo and analytical models. Deployment, adoption and market power are unmeasured.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50616b"/></marker></defs><rect width="1000" height="640" fill="#fcfbf7"/><text x="45" y="50" fill="#152a34" font-family="sans-serif" font-size="25" font-weight="bold">Walify: vision and public evidence</text><path d="M260 215 L260 265" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><path d="M740 215 L740 265" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="105" width="910" height="110" rx="8" fill="white" stroke="#91a0a4"/><text x="63" y="137" font-family="sans-serif" font-size="20" fill="#152a34">Author-stated vision</text><text x="63" y="165" font-family="sans-serif" font-size="16" fill="#50616b">People and AI agents use software together; Tavi is the personal assistant.</text><rect x="45" y="265" width="420" height="230" rx="8" fill="white" stroke="#91a0a4"/><text x="63" y="297" font-family="sans-serif" font-size="20" fill="#152a34">Inspectable public work</text><text x="63" y="325" font-family="sans-serif" font-size="16" fill="#50616b">Python and SQLite teaching demo</text><text x="63" y="348" font-family="sans-serif" font-size="16" fill="#50616b">Approval, recovery and receipts</text><text x="63" y="371" font-family="sans-serif" font-size="16" fill="#50616b">Five analytical sensitivity models</text><text x="63" y="394" font-family="sans-serif" font-size="16" fill="#50616b">Reproducible code and tests</text><rect x="535" y="265" width="420" height="230" rx="8" fill="white" stroke="#91a0a4"/><text x="553" y="297" font-family="sans-serif" font-size="20" fill="#152a34">Still to establish</text><text x="553" y="325" font-family="sans-serif" font-size="16" fill="#50616b">Deployed general capability network</text><text x="553" y="348" font-family="sans-serif" font-size="16" fill="#50616b">Measured user and provider value</text><text x="553" y="371" font-family="sans-serif" font-size="16" fill="#50616b">Production-scale reliability</text><text x="553" y="394" font-family="sans-serif" font-size="16" fill="#50616b">Sustainable marketplace economics</text><text x="45" y="582" font-family="sans-serif" font-size="16" fill="#50616b">EVIDENCE BOUNDARY · Vision is not a deployment claim.</text><text x="45" y="605" font-family="sans-serif" font-size="16" fill="#50616b">No private Walify implementation or metrics are described.</text></svg>
