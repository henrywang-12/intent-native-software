<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">A shared software environment</title><desc id="desc">Proposed architecture: human and agent clients propose actions to a policy gate, then an execution coordinator invokes domain services and verifies evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50616b"/></marker></defs><rect width="1000" height="640" fill="#fcfbf7"/><text x="45" y="50" fill="#152a34" font-family="sans-serif" font-size="25" font-weight="bold">A shared software environment</text><path d="M255 195 L400 245" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 195 L600 245" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 345 L185 405" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><path d="M325 465 L365 465" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><path d="M645 465 L685 465" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="95" width="420" height="100" rx="8" fill="white" stroke="#91a0a4"/><text x="63" y="127" font-family="sans-serif" font-size="20" fill="#152a34">People and familiar interfaces</text><text x="63" y="155" font-family="sans-serif" font-size="16" fill="#50616b">Inspect, compare, approve, correct</text><rect x="535" y="95" width="420" height="100" rx="8" fill="white" stroke="#91a0a4"/><text x="553" y="127" font-family="sans-serif" font-size="20" fill="#152a34">Agent clients</text><text x="553" y="155" font-family="sans-serif" font-size="16" fill="#50616b">Interpret goals and propose plans</text><rect x="265" y="245" width="470" height="100" rx="8" fill="white" stroke="#91a0a4"/><text x="283" y="277" font-family="sans-serif" font-size="20" fill="#152a34">Authority and policy boundary</text><text x="283" y="305" font-family="sans-serif" font-size="16" fill="#50616b">Concrete grants; current constraints</text><rect x="45" y="405" width="280" height="120" rx="8" fill="white" stroke="#91a0a4"/><text x="63" y="437" font-family="sans-serif" font-size="20" fill="#152a34">Execution coordinator</text><text x="63" y="465" font-family="sans-serif" font-size="16" fill="#50616b">Persist intent; dispatch;</text><text x="63" y="488" font-family="sans-serif" font-size="16" fill="#50616b">reconcile uncertainty</text><rect x="365" y="405" width="280" height="120" rx="8" fill="white" stroke="#91a0a4"/><text x="383" y="437" font-family="sans-serif" font-size="20" fill="#152a34">Domain services</text><text x="383" y="465" font-family="sans-serif" font-size="16" fill="#50616b">Durable state and</text><text x="383" y="488" font-family="sans-serif" font-size="16" fill="#50616b">capability contracts</text><rect x="685" y="405" width="270" height="120" rx="8" fill="white" stroke="#91a0a4"/><text x="703" y="437" font-family="sans-serif" font-size="20" fill="#152a34">Evidence and review</text><text x="703" y="465" font-family="sans-serif" font-size="16" fill="#50616b">Verify effects;</text><text x="703" y="488" font-family="sans-serif" font-size="16" fill="#50616b">support human recovery</text><text x="45" y="582" font-family="sans-serif" font-size="16" fill="#50616b">PROPOSED ARCHITECTURE · The planner does not issue its own authority.</text><text x="45" y="605" font-family="sans-serif" font-size="16" fill="#50616b">The public demo implements a small local subset; this is not a deployed-system diagram.</text></svg>
