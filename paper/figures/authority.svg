<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Permission, commitment and recovery</title><desc id="desc">A proposal passes through grant validation to a declared commitment boundary. Revocation before commitment blocks future action; afterward provider cancellation or compensation may be needed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50616b"/></marker></defs><rect width="1000" height="640" fill="#fcfbf7"/><text x="45" y="50" fill="#152a34" font-family="sans-serif" font-size="25" font-weight="bold">Permission, commitment and recovery</text><path d="M325 170 L365 170" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><path d="M645 170 L685 170" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 230 L255 360" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 230 L745 360" stroke="#50616b" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="110" width="280" height="120" rx="8" fill="white" stroke="#91a0a4"/><text x="63" y="142" font-family="sans-serif" font-size="20" fill="#152a34">Proposal</text><text x="63" y="170" font-family="sans-serif" font-size="16" fill="#50616b">Goal and parameters;</text><text x="63" y="193" font-family="sans-serif" font-size="16" fill="#50616b">no permission implied</text><rect x="365" y="110" width="280" height="120" rx="8" fill="white" stroke="#91a0a4"/><text x="383" y="142" font-family="sans-serif" font-size="20" fill="#152a34">Grant validation</text><text x="383" y="170" font-family="sans-serif" font-size="16" fill="#50616b">Actor, resource, limits,</text><text x="383" y="193" font-family="sans-serif" font-size="16" fill="#50616b">expiry and revocation</text><rect x="685" y="110" width="270" height="120" rx="8" fill="white" stroke="#91a0a4"/><text x="703" y="142" font-family="sans-serif" font-size="20" fill="#152a34">Commitment boundary</text><text x="703" y="170" font-family="sans-serif" font-size="16" fill="#50616b">Defined by the</text><text x="703" y="193" font-family="sans-serif" font-size="16" fill="#50616b">execution contract</text><rect x="45" y="360" width="420" height="150" rx="8" fill="white" stroke="#91a0a4"/><text x="63" y="392" font-family="sans-serif" font-size="20" fill="#152a34">Before commitment</text><text x="63" y="420" font-family="sans-serif" font-size="16" fill="#50616b">Revocation blocks future action.</text><text x="63" y="443" font-family="sans-serif" font-size="16" fill="#50616b">A coordinator check alone</text><text x="63" y="466" font-family="sans-serif" font-size="16" fill="#50616b">does not eliminate the race.</text><rect x="535" y="360" width="420" height="150" rx="8" fill="white" stroke="#91a0a4"/><text x="553" y="392" font-family="sans-serif" font-size="20" fill="#152a34">After commitment</text><text x="553" y="420" font-family="sans-serif" font-size="16" fill="#50616b">Read authoritative state.</text><text x="553" y="443" font-family="sans-serif" font-size="16" fill="#50616b">Cancellation or compensation</text><text x="553" y="466" font-family="sans-serif" font-size="16" fill="#50616b">is a separate operation.</text><text x="45" y="582" font-family="sans-serif" font-size="16" fill="#50616b">CONCEPTUAL LIFECYCLE · The commitment boundary must have an explicit ordering rule.</text><text x="45" y="605" font-family="sans-serif" font-size="16" fill="#50616b">Missing evidence remains unknown; it is not proof that no effect occurred.</text></svg>
