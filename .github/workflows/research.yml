name: Research reproducibility

on:
  pull_request:
    paths: ['paper/**', 'research/**', 'scripts/**', '.github/workflows/research.yml']
  push:
    branches: [main]
    paths: ['paper/**', 'research/**', 'scripts/**', '.github/workflows/research.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Markdown==3.7
      - run: python -W error::ResourceWarning -m unittest discover -s demo -v
      - run: python -W error::ResourceWarning -m unittest discover -s research/experiments -v
      - run: python -W error::ResourceWarning -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/validate_research.py --check-render
      - run: python scripts/run_models.py
      - run: python demo/scenarios.py
